name: Alternate Day Scan (4H/15min)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '4H 15min'

  # Scheduled: Lun-Ven alle 02:00 UTC (04:00 Rome CEST estivo / 03:00 CET invernale)
  # Primo scanner della sequenza mattutina — è il più lento (4H+15min, molti asset)
  # quindi parte per primo per dare spazio ai successivi.
  #
  # Sequenza completa (gap 60 min tra un cron e l'altro, > 35-40 min di durata reale):
  #   02:00 UTC → scheduled_scan  (questo file, 4H + 15min)
  #   03:00 UTC → hourly_1h_scan  (1H, run mattutino)
  #   04:00 UTC → daily_scan      (5min + 1min)
  #   12:00 UTC → hourly_1h_scan  (1H, run pomeridiano)
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  # Vincolo operativo dell'utente: tutti gli scan mattutini DEVONO finire entro
  # le 09:00 italiano sia in estate che in inverno — con questo calendario,
  # l'ultimo scan mattutino finisce verso 06:40 IT in estate, 05:40 IT in inverno.
  schedule:
    - cron: '0 2 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run alternate day scan (4H/15min)
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '4H 15min' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scan-screenshots
          path: data/screenshots/
          retention-days: 7

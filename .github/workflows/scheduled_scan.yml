name: Alternate Day Scan (4H/15min)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '4H 15min'

  # Scheduled: Lun-Ven alle 01:55 UTC → esecuzione effettiva ~02:00 UTC
  # = 04:00 Rome CEST (estivo) / 03:00 CET (invernale)
  #
  # PERCHÉ :55 e non :00:
  # GitHub Actions ha un ritardo noto sui cron schedulati "all'ora esatta"
  # (es. 0 2, 0 3, 0 12) perché sono i minuti di maggior carico globale.
  # Un cron "0 12" può partire con 30-60 min di ritardo. Spostandolo a :55
  # del minuto precedente si finisce in una coda molto meno affollata e
  # il workflow parte entro 2-5 min, risultando effettivamente ~02:00 UTC.
  #
  # Sequenza completa (gap 60 min, durata reale ~15-20 min):
  #   01:55 UTC → scheduled_scan  (questo file, 4H + 15min)
  #   02:55 UTC → hourly_1h_scan  (1H, run mattutino)
  #   03:55 UTC → daily_scan      (5min + 1min)
  #   11:55 UTC → hourly_1h_scan  (1H, run pomeridiano)
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  schedule:
    - cron: '55 1 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run alternate day scan (4H/15min)
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '4H 15min' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scan-screenshots
          path: data/screenshots/
          retention-days: 7

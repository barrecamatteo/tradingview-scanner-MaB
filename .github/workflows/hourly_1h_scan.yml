name: 2x Daily Scan (1H)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '1H'

  # Scheduled: Lun-Ven due volte al giorno
  #   02:55 UTC → esecuzione effettiva ~03:00 UTC = 05:00 CEST / 04:00 CET (mattutino)
  #   11:55 UTC → esecuzione effettiva ~12:00 UTC = 14:00 CEST / 13:00 CET (pomeridiano)
  #
  # PERCHÉ :55 e non :00:
  # GitHub Actions ha un ritardo noto sui cron "all'ora esatta" (0 11, 0 12, ecc.)
  # perché sono i minuti di maggior carico globale. I workflow schedulati su questi
  # minuti possono essere ritardati di 30-60 min. Spostando a :55 del minuto precedente
  # si finisce in una coda poco affollata e il workflow parte entro 2-5 min di ritardo.
  #
  # Sequenza completa (gap 60 min, durata reale ~15-20 min):
  #   01:55 UTC → scheduled_scan  (4H + 15min)
  #   02:55 UTC → hourly_1h_scan  (questo file, 1H mattutino)
  #   03:55 UTC → daily_scan      (5min + 1min)
  #   11:55 UTC → hourly_1h_scan  (questo file, 1H pomeridiano)
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  schedule:
    - cron: '55 2 * * 1-5'
    - cron: '55 11 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run 1H scan
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '1H' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1h-scan-screenshots
          path: data/screenshots/
          retention-days: 7

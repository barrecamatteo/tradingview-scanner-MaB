name: 2x Daily Scan (1H)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '1H'

  # Scheduled: Lun-Ven due volte al giorno
  #   03:00 UTC (05:00 CEST / 04:00 CET) → run mattutino
  #   12:00 UTC (14:00 CEST / 13:00 CET) → run pomeridiano
  #
  # Sequenza completa (gap 60 min tra un cron e l'altro, > 35-40 min di durata reale):
  #   02:00 UTC → scheduled_scan  (4H + 15min)
  #   03:00 UTC → hourly_1h_scan  (questo file, 1H mattutino)
  #   04:00 UTC → daily_scan      (5min + 1min)
  #   12:00 UTC → hourly_1h_scan  (questo file, 1H pomeridiano)
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  # Vincolo dell'utente: tutti gli scan mattutini devono finire entro le 09:00 IT
  # sia in estate che in inverno. Con questo calendario l'ultimo scan mattutino
  # (daily_scan a 04:00 UTC) finisce verso 06:40 IT in estate, 05:40 IT in inverno.
  schedule:
    - cron: '0 3 * * 1-5'
    - cron: '0 12 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run 1H scan
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '1H' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1h-scan-screenshots
          path: data/screenshots/
          retention-days: 7

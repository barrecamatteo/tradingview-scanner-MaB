name: 2x Daily Scan (1H)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '1H'

  # AGGIORNAMENTO 2026-05-27: GitHub Actions free tier mostra ritardo SISTEMATICO
  # di ~4 ore. Anticipiamo entrambi i cron così:
  #   - Mattutino: finire entro le 09:00 ora italiana (CEST)
  #   - Pomeridiano: partire intorno alle 14:00 ora italiana (CEST)
  #
  # Scheduled: Lun-Ven due volte al giorno
  #   00:47 UTC → con ritardo GH ~4h → reale ~04:47 UTC = 06:47 CEST / 05:47 CET (mattutino, finisce 07:07 CEST)
  #   07:47 UTC → con ritardo GH ~4h → reale ~11:47 UTC = 13:47 CEST / 12:47 CET (pomeridiano, finisce 14:07 CEST)
  #
  # Minuti sparsi (:47) per evitare la coda dei cron "all'ora tonda" (:00, :15, :30, :45)
  # che GitHub privilegia con maggior ritardo per carico globale.
  #
  # Sequenza completa mattutina (ritardo GH ~4h, runtime ~15-20 min):
  #   23:25 UTC (sera prima) → daily_1d_scan   (1D)                       → reale ~05:25 CEST
  #   00:15 UTC              → scheduled_scan  (4H + 15min)               → reale ~06:15 CEST
  #   00:47 UTC              → hourly_1h_scan  (questo file, 1H mattutino) → reale ~06:47 CEST
  #   01:33 UTC              → daily_scan      (5min + 1min)              → reale ~07:33 CEST ✓ < 09:00
  #   07:47 UTC              → hourly_1h_scan  (questo file, 1H pomeridiano) → reale ~13:47 CEST
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  schedule:
    - cron: '47 0 * * 1-5'
    - cron: '47 7 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run 1H scan
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '1H' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1h-scan-screenshots
          path: data/screenshots/
          retention-days: 7

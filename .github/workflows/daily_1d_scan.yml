name: Daily Scan (1D)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '1D'

  # AGGIORNAMENTO 2026-05-27: GitHub Actions free tier mostra ritardo SISTEMATICO
  # di ~4 ore per i cron di questo repo. Anticipiamo tutta la sequenza per garantire
  # che tutti gli scan mattutini siano completati entro le 09:00 ora italiana (CEST).
  #
  # Scheduled: Dom-Gio alle 23:25 UTC (= sera prima del giorno target)
  # → con ritardo GH ~4h, run reale ~03:25 UTC del giorno dopo = 05:25 CEST (estivo) / 04:25 CET (invernale)
  # Finisce entro le 05:45 CEST. Candela 1D forex chiusa alle 21-22 UTC: ampio margine.
  #
  # Giorni 0-4 (dom-gio): domenica sera schedula il run di lunedì mattina,
  # lunedì sera quello di martedì, ..., giovedì sera quello di venerdì.
  # Venerdì sera NON serve (sabato mercato chiuso).
  #
  # Sequenza completa mattutina (ritardo GH ~4h, runtime ~15-20 min):
  #   23:25 UTC (sera prima) → daily_1d_scan   (questo file, 1D)        → reale ~05:25 CEST → finisce 05:45 CEST
  #   00:15 UTC              → scheduled_scan  (4H + 15min)              → reale ~06:15 CEST → finisce 06:35 CEST
  #   00:47 UTC              → hourly_1h_scan  (1H mattutino)            → reale ~06:47 CEST → finisce 07:07 CEST
  #   01:33 UTC              → daily_scan      (5min + 1min)             → reale ~07:33 CEST → finisce 07:53 CEST ✓ < 09:00
  #   07:47 UTC              → hourly_1h_scan  (1H pomeridiano)          → reale ~13:47 CEST
  #
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  schedule:
    - cron: '25 23 * * 0-4'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run 1D scan
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '1D' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1d-scan-screenshots
          path: data/screenshots/
          retention-days: 7

name: Daily Scan (5min/1min)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '5min 1min'

  # Scheduled: Lun-Ven alle 03:55 UTC → esecuzione effettiva ~04:00 UTC
  # = 06:00 CEST (estivo) / 05:00 CET (invernale)
  # Ultimo scanner della sequenza mattutina.
  #
  # PERCHÉ :55 e non :00:
  # GitHub Actions ha un ritardo noto sui cron "all'ora esatta" perché sono i
  # minuti di maggior carico globale. Spostando a :55 del minuto precedente
  # il workflow parte entro 2-5 min dallo schedulato invece di 30-60 min.
  #
  # Sequenza completa (gap 60 min, durata reale ~15-20 min):
  #   01:55 UTC → scheduled_scan  (4H + 15min)
  #   02:55 UTC → hourly_1h_scan  (1H mattutino)
  #   03:55 UTC → daily_scan      (questo file, 5min + 1min)
  #   11:55 UTC → hourly_1h_scan  (1H pomeridiano)
  #
  # Solo lun-ven perché il mercato forex è chiuso nel weekend.
  schedule:
    - cron: '55 3 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run daily scan (5min/1min)
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '5min 1min' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-screenshots
          path: data/screenshots/
          retention-days: 7

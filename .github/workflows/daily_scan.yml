name: Daily Scan (5min/1min)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (space-separated)'
        required: false
        default: '5min 1min'

  # AGGIORNAMENTO 2026-05-27: GitHub Actions free tier mostra ritardo SISTEMATICO
  # di ~4 ore. Anticipiamo per finire entro le 09:00 ora italiana (CEST).
  #
  # Scheduled: Lun-Ven alle 01:33 UTC → con ritardo GH ~4h, reale ~05:33 UTC
  # = 07:33 CEST (estivo) / 06:33 CET (invernale). Finisce entro 07:53 CEST.
  # Ultimo scanner della sequenza mattutina.
  #
  # Minuti sparsi (:33) per evitare la coda dei cron "all'ora tonda" (:00, :15, :30, :45)
  # che GitHub privilegia con maggior ritardo per carico globale.
  #
  # Sequenza completa mattutina (ritardo GH ~4h, runtime ~15-20 min):
  #   23:25 UTC (sera prima) → daily_1d_scan   (1D)                  → reale ~05:25 CEST
  #   00:15 UTC              → scheduled_scan  (4H + 15min)          → reale ~06:15 CEST
  #   00:47 UTC              → hourly_1h_scan  (1H mattutino)        → reale ~06:47 CEST
  #   01:33 UTC              → daily_scan      (questo file, 5min+1min) → reale ~07:33 CEST → finisce 07:53 ✓ < 09:00
  #   07:47 UTC              → hourly_1h_scan  (1H pomeridiano)      → reale ~13:47 CEST
  #
  # Solo lun-ven perché il mercato forex è chiuso nel weekend.
  # NOTA ora legale: gli orari italiani slittano di 1h indietro in inverno (CET).
  schedule:
    - cron: '33 1 * * 1-5'

env:
  TV_USERNAME: ${{ secrets.TV_USERNAME }}
  TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TV_COOKIES: ${{ secrets.TV_COOKIES }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore cookies
        run: |
          mkdir -p data
          echo "$TV_COOKIES" | base64 -d > data/tv_cookies.json
          echo "Cookies restored to data/tv_cookies.json"

      - name: Run daily scan (5min/1min)
        run: |
          python run_scan.py --timeframes ${{ github.event.inputs.timeframes || '5min 1min' }} --method csv

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-screenshots
          path: data/screenshots/
          retention-days: 7
